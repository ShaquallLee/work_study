<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>学习资料库</title>
  <meta name="description" content="个人学习资料库 - 支持 Markdown / PDF / DOCX 文档在线阅读" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <!-- highlight.js 代码高亮主题 -->
  <link id="hljs-light" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" />
  <link id="hljs-dark" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" disabled />
</head>
<body>
  <!-- 顶部导航栏 -->
  <header class="header">
    <div class="header-inner">
      <div class="logo" id="logo">
        <span class="logo-icon">📚</span>
        <span class="logo-text">学习资料库</span>
      </div>
      <div class="header-actions">
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.3-4.3"></path>
          </svg>
          <input type="search" id="search-input" placeholder="搜索标题、标签、描述…" autocomplete="off" />
          <button class="search-clear" id="search-clear" hidden>✕</button>
        </div>
        <button id="theme-toggle" class="icon-btn" title="切换深色/浅色主题" aria-label="切换主题">
          <span class="theme-icon">🌙</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 工具栏：分类与标签筛选 -->
  <div class="toolbar" id="toolbar">
    <div class="toolbar-row">
      <span class="filter-label">分类：</span>
      <div class="filter-group" id="category-filters"></div>
    </div>
    <div class="toolbar-row">
      <span class="filter-label">标签：</span>
      <div class="filter-group tags-filter" id="tag-filters"></div>
    </div>
  </div>

  <!-- 文档列表 -->
  <main class="main">
    <div class="stats-bar" id="stats-bar"></div>
    <div class="grid" id="doc-grid"></div>
    <div class="empty-state" id="empty-state" hidden>
      <div class="empty-icon">🔍</div>
      <p>没有找到匹配的文档</p>
      <button class="btn-secondary" id="clear-filters">清除筛选条件</button>
    </div>
  </main>

  <!-- 文档查看器（全屏覆盖层） -->
  <div class="viewer" id="viewer" hidden>
    <div class="viewer-header">
      <button class="viewer-btn viewer-back" id="viewer-back" title="返回列表 (Esc)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <path d="m15 18-6-6 6-6"></path>
        </svg>
        <span>返回列表</span>
      </button>
      <h2 class="viewer-title" id="viewer-title"></h2>
      <button class="viewer-btn viewer-close" id="viewer-close" title="关闭 (Esc)" aria-label="关闭">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 6 6 18M6 6l12 12"></path>
        </svg>
      </button>
    </div>

    <div class="viewer-body" id="viewer-body">
      <!-- 加载指示器 -->
      <div class="viewer-loading" id="viewer-loading">
        <div class="spinner"></div>
        <p>加载中…</p>
      </div>

      <!-- Markdown 视图 -->
      <article class="doc-content markdown-body" id="markdown-view" hidden></article>

      <!-- PDF 视图 -->
      <div class="pdf-view" id="pdf-view" hidden>
        <div class="pdf-toolbar">
          <button class="pdf-btn" id="pdf-prev" title="上一页">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"></path></svg>
          </button>
          <span class="pdf-page-info" id="pdf-page-info">1 / 1</span>
          <button class="pdf-btn" id="pdf-next" title="下一页">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"></path></svg>
          </button>
          <div class="pdf-sep"></div>
          <button class="pdf-btn" id="pdf-zoom-out" title="缩小">−</button>
          <span class="pdf-zoom-level" id="pdf-zoom-level">100%</span>
          <button class="pdf-btn" id="pdf-zoom-in" title="放大">+</button>
          <div class="pdf-sep"></div>
          <button class="pdf-btn" id="pdf-download" title="下载原文件">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"></path></svg>
          </button>
        </div>
        <div class="pdf-container" id="pdf-container"></div>
      </div>

      <!-- DOCX 视图 -->
      <article class="doc-content docx-body" id="docx-view" hidden></article>
    </div>
  </div>

  <!-- 返回顶部按钮 -->
  <button class="back-to-top" id="back-to-top" hidden title="返回顶部">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
      <path d="m18 15-6-6-6 6"></path>
    </svg>
  </button>

  <!-- 第三方库 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/lib/marked.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.9/dist/purify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>

  <!-- 应用脚本 -->
  <script src="assets/js/viewer.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
